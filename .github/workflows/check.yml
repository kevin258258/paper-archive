name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: python scripts/test.py
      - run: |
          for file in desktop/*.cjs; do node --check "$file"; done
          for file in public/*.js; do node --check "$file"; done
      - run: xvfb-run -a node_modules/.bin/electron --disable-gpu scripts/test_article_view.cjs
